<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 24 24">
  <!-- Master for the favicon generator: full-bleed ink square (platforms apply their
       own rounding/masking), teal + orange bars. Content sits inside a ~12.5% margin,
       safe for Android maskable cropping. -->
  <rect width="24" height="24" fill="#0d0d0b"/>
  <rect x="3" y="8" width="4" height="8" rx="2" fill="#00bba7"/>
  <rect x="10" y="3" width="4" height="18" rx="2" fill="#00bba7"/>
  <rect x="17" y="5" width="4" height="14" rx="2" fill="#ff6900"/>
</svg>
